# alloy — a temper home for a stock Bazzite desktop.
#
# This is the manifest: which machines this spec describes, and which bundles in
# apps/ each of them composes. Everything else lives in apps/ (recipes) and
# assets/ (the real files those recipes deploy).
#
# FIRST THING TO CHANGE: the machine name below must match your hostname, or
# temper will not find a machine block for this box and will refuse to run. Run
# `hostname -s` and put that here. `temper init` will also write a block for you,
# seeded from what is already installed.
#
# WRITTEN FOR TEMPER 7.5.5; needs 7.4.0 or newer, because `rpm_repos` in
# apps/rpm-layered.toml and apps/vivaldi.toml arrived there and an unknown
# manifest field is a parse error, not a warning. If a newer temper rejects
# something in this folder, temper is right and the folder is stale: read
# `temper --llm`, MANIFEST SCHEMA first, and reconcile it. See the README.

# A synced folder is not a repo. Every git behaviour is off because the copy you
# were handed may live in Nextcloud, on a USB stick, or in a git clone — temper
# treats all three the same and never assumes it can commit or fetch. Turn these
# on yourself if you keep this in a repo of your own:
#   temper configure set git.auto_commit true
[git]
remind      = false
auto_commit = false
auto_push   = false
auto_pull   = false
auto_rebase = false

[[machine]]
name = "CHANGE-ME"      # `hostname -s`
os   = "linux"
role = "desktop"        # "desktop" means this box has a graphical session.
                        # Every role gate in apps/ tests exactly that, and a
                        # machine with no role set fails those gates closed —
                        # so leave it in place.

# Bundles from apps/. A bundle not listed here does nothing, which is how one
# spec serves people who want different software: add and remove names.
#
# `vivaldi` is the deliberate example of that. Vivaldi is packaged and kept
# current here, and is composed only by machines whose owner actually wants it —
# it is not part of anyone's default. Drop the name and no Vivaldi repo, key or
# package ever touches the machine.
apps = ["rpm-layered", "shell", "zsh", "ghostty", "gnome"]

# Bundles this spec maintains but does NOT compose by default, because each one
# makes a decision you should make yourself. Add the name to take it:
#
#   "vivaldi"      the Vivaldi browser, from Vivaldi's own repo.
#   "brave-linux"  Brave's managed policy — force-installs the 1Password
#                  extension, disables Brave's own password manager, pins DNS
#                  and search — plus Brave as the default web handler. Read
#                  apps/brave-linux.toml before taking it.
#   "1password"    1Password itself, and the glue its own installer leaves out
#                  for Brave Origin: the /etc allowlist entry and the
#                  native-messaging manifest. Trusts ublue-os/tap. Take it
#                  together with "brave-linux" if you use 1Password with Brave.

brewfile = "brewfiles/desktop"
