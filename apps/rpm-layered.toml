# Where this desktop's repo-provided software comes from: the third-party repos,
# their signing keys, and the packages layered out of them.
#
# COMPOSE THIS ONLY ON A STOCK BAZZITE BASE. rpm-ostree cannot layer a package
# the base image already provides, so on a base that bakes any of these in, the
# whole list reports as failed.
#
# The list is deliberately short. Layering is the channel of last resort here —
# after Homebrew, after Flatpak — because every repo below becomes a dependency
# of the update path: if one cannot answer, `rpm-ostree upgrade` does not
# complete and the machine stays on its current deployment. That is stale, not
# broken (rollback is a reboot), but it is a real cost paid per machine, so
# nothing is layered that a cask or a flatpak could carry instead.
#
#
# Why the repo files are declared here rather than left to the machine: `/etc` is
# merge-forward on an ostree system. Whatever is in /etc/yum.repos.d survives a
# rebase, which makes their absence invisible — the machine keeps working and
# nothing says the files are unowned. A from-scratch reinstall is where that
# bites: no repos, so nothing below has a provider.
#
# Keys are files on disk, referenced as gpgkey=file:///…, rather than URLs. That
# pins trust to the key this spec vouches for instead of whatever the vendor's
# URL serves at install time.
os   = "linux"
role = "desktop"

rpm_ostree = [
    # Brave Origin. Native rather than a flatpak because 1Password's browser
    # integration needs a native-messaging manifest plus an /etc allowlist
    # entry, and a sandboxed browser can reach neither. If you do not use
    # 1Password, a flatpak browser is a perfectly good choice instead.
    "brave-origin",
    # Ghostty — not in Fedora main as of F44, so it comes from the COPR that
    # Ghostty's own install docs name as canonical. An AppImage exists and a brew
    # cask would work, but terminfo decides it: a native install puts
    # xterm-ghostty in /usr/share/terminfo, while an AppImage keeps it inside a
    # squashfs mounted at a per-launch temp path — which breaks keys and colours
    # over ssh in a way that is annoying to diagnose.
    "ghostty",
    # The graphical settings GNOME leaves out and Bazzite does not ship.
    "gnome-tweaks",
]


# The repos these come from. `rpm_repos` installs each BEFORE any package
# converge — the key before the repo citing it — so a clean machine resolves the
# packages above on its FIRST run. There is no `to`: the destination is
# /etc/yum.repos.d/<basename> and /etc/pki/rpm-gpg/<basename>, which is why two
# of these assets are named for where they land rather than for what they are.
#
# One line per entry: TOML 1.0 does not let an inline table span lines.
rpm_repos = [
    # brave-origin comes from the same bucket and signing key as the
    # brave-browser package it replaced, so the repo keeps Brave's own naming.
    { repo = "assets/rpm-repos/brave-browser.repo", key = "assets/rpm-repos/RPM-GPG-KEY-brave-browser" },
    # brave-origin's postinstall writes a SECOND repo file at this path, pointing
    # at a dl.google.com URL that 404s — Chrome packaging boilerplate Brave never
    # adapted — with enabled=1. Left alone it fails the metadata refresh every
    # `rpm-ostree upgrade` needs and pins the machine to a stale deployment. This
    # spec owns the path with bytes that say enabled=0, which is how a disabled
    # repo is expressed; the repo above is the real provider.
    { repo = "assets/rpm-repos/brave-origin.repo" },
    # Ghostty's COPR. No key asset: COPR cites its key by URL with
    # repo_gpgcheck=0, its own shape, with no metadata-signing race to lose.
    # Named as `dnf5 copr enable` would name it, so enabling it by hand and
    # declaring it here agree rather than leaving two files for one repo id.
    { repo = "assets/rpm-repos/_copr:copr.fedorainfracloud.org:scottames:ghostty.repo" },
]

[[assert]]
absent  = "/etc/yum.repos.d/_copr_scottames-ghostty.repo"
message = "a second file declares the ghostty COPR with the same repo id — remove it: sudo rm '/etc/yum.repos.d/_copr_scottames-ghostty.repo'"
