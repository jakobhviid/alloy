# Where this desktop's repo-provided software comes from: the third-party repos,
# their signing keys, and the packages layered out of them.
#
# COMPOSE THIS ONLY ON A STOCK BAZZITE BASE. rpm-ostree cannot layer a package
# the base image already provides, so on a base that bakes any of these in, the
# whole list reports as failed.
#
# The list is deliberately short. Layering is the channel of last resort here —
# after Homebrew, after Flatpak — because every repo below becomes a dependency
# of the update path: if one cannot answer, `rpm-ostree upgrade` does not
# complete and the machine stays on its current deployment. That is stale, not
# broken (rollback is a reboot), but it is a real cost paid per machine, so
# nothing is layered that a cask or a flatpak could carry instead.
#
#
# YOUR FIRST `temper install` WILL REPORT THESE PACKAGES AS FAILED, and a second
# one will succeed. That is expected, and it is worth knowing before it happens.
# temper converges packages BEFORE config steps, and the repo files below are
# config — so on the first pass rpm-ostree is asked for packages whose repos are
# not on disk yet. The same pass writes the repos; run `temper install` again and
# they layer. There is no --config-only flag to sequence it differently.
#
# Why the repo files are declared here rather than left to the machine: `/etc` is
# merge-forward on an ostree system. Whatever is in /etc/yum.repos.d survives a
# rebase, which makes their absence invisible — the machine keeps working and
# nothing says the files are unowned. A from-scratch reinstall is where that
# bites: no repos, so nothing below has a provider.
#
# Keys are files on disk, referenced as gpgkey=file:///…, rather than URLs. That
# pins trust to the key this spec vouches for instead of whatever the vendor's
# URL serves at install time.
os   = "linux"
role = "desktop"

rpm_ostree = [
    # Brave Origin. Native rather than a flatpak because 1Password's browser
    # integration needs a native-messaging manifest plus an /etc allowlist
    # entry, and a sandboxed browser can reach neither. If you do not use
    # 1Password, a flatpak browser is a perfectly good choice instead.
    "brave-origin",
    # Ghostty — not in Fedora main as of F44, so it comes from the COPR that
    # Ghostty's own install docs name as canonical. An AppImage exists and a brew
    # cask would work, but terminfo decides it: a native install puts
    # xterm-ghostty in /usr/share/terminfo, while an AppImage keeps it inside a
    # squashfs mounted at a per-launch temp path — which breaks keys and colours
    # over ssh in a way that is annoying to diagnose.
    "ghostty",
    # The graphical settings GNOME leaves out and Bazzite does not ship.
    "gnome-tweaks",
]

# Bundle-level keys stop at the first table header below: an `rpm_ostree` line
# after a `[[step]]` is read as a field OF that step and fails to parse.

# ─── Brave ────────────────────────────────────────────────────────────────────
[[step]]
sysfile = "assets/rpm-repos/RPM-GPG-KEY-brave-browser"
to      = "/etc/pki/rpm-gpg/RPM-GPG-KEY-brave-browser"
mode    = "0644"
owner   = "root"
group   = "root"

[[step]]
sysfile = "assets/rpm-repos/brave-browser.repo"
to      = "/etc/yum.repos.d/brave-browser.repo"
mode    = "0644"
owner   = "root"
group   = "root"

# brave-origin's postinstall writes a SECOND repo file, /etc/yum.repos.d/
# brave-origin.repo, pointing at https://dl.google.com/linux/brave-origin/rpm/
# stable — Chrome packaging boilerplate Brave never adapted. That URL is 404
# (checked 2026-09-08) and the file carries enabled=1, so left alone it fails
# the metadata refresh that `rpm-ostree upgrade` needs and pins the machine to a
# stale deployment.
#
# So this spec owns that path too, as a disabled stub: the repo above is the real
# provider, so the vendor's entry has no job to do. It is the one place here
# where temper owns a file a package also writes — Brave rewrites it during each
# upgrade and temper restores it on the next converge, which shows up as honest
# drift with a real fix rather than as a repo that quietly blocks updates.
[[step]]
sysfile = "assets/rpm-repos/brave-origin-disabled.repo"
to      = "/etc/yum.repos.d/brave-origin.repo"
mode    = "0644"
owner   = "root"
group   = "root"

# ─── Ghostty ──────────────────────────────────────────────────────────────────
# COPR files carry their key as a URL with repo_gpgcheck=0, which is COPR's own
# shape and has no metadata-signing race to lose. Deployed under the filename
# `dnf5 copr enable` would write, so enabling it by hand and declaring it here
# agree rather than leaving two files for one repo id.
[[step]]
sysfile = "assets/rpm-repos/ghostty-copr.repo"
to      = "/etc/yum.repos.d/_copr:copr.fedorainfracloud.org:scottames:ghostty.repo"
mode    = "0644"
owner   = "root"
group   = "root"

[[assert]]
absent  = "/etc/yum.repos.d/_copr_scottames-ghostty.repo"
message = "a second file declares the ghostty COPR with the same repo id — remove it: sudo rm '/etc/yum.repos.d/_copr_scottames-ghostty.repo'"
