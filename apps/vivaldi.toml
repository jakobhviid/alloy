# Vivaldi, layered from Vivaldi's own RPM repo.
#
# Composed only by machines that want it — see the note on `apps` in temper.toml.
# It is packaged here so that whoever uses it gets a maintained definition rather
# than installing Vivaldi by hand, and a machine that leaves the bundle out of
# its `apps` list never sees the repo or the package.
#
# Vivaldi has to be a native package rather than a flatpak if 1Password's browser
# integration matters to you: that integration needs a native-messaging manifest
# and an /etc allowlist entry, and a sandboxed browser can reach neither.
#
# If you use 1Password with Vivaldi, compose the `1password` bundle too. Vivaldi
# needs one thing 1Password's installer does not do — its basename is not on
# 1Password's trusted list, so `vivaldi-bin` has to be in
# /etc/1password/custom_allowed_browsers — and that bundle adds it whenever
# Vivaldi is installed. Nothing further is needed here: Vivaldi is Chromium-based
# and reads the native-messaging manifest 1Password already writes.
os   = "linux"
role = "desktop"

rpm_ostree = ["vivaldi-stable"]

# Vivaldi's repo. Declaring a file that a package also writes is normally a
# mistake: vivaldi-stable's %post runs `cat > /etc/yum.repos.d/vivaldi.repo`
# unconditionally on every install and upgrade, so the package owns that file's
# steady state and wins any disagreement once per Vivaldi release.
#
# It is safe here for one specific reason — the asset is Vivaldi's own content
# verbatim, including the archive baseurl, the literal x86_64 its %post
# hardcodes, and the remote gpgkey it imports itself. temper writes exactly what
# the package writes, so the two have nothing to disagree about and no key asset
# is needed. The cost is that this asset must be updated if Vivaldi ever changes
# that file; what it buys is the repo being on disk before the package needs it,
# which is what a machine starting from nothing requires.
rpm_repos = [
    { repo = "assets/rpm-repos/vivaldi.repo" },
]
