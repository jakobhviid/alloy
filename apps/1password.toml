# 1Password, and the glue that makes its browser integration reach Brave Origin.
#
# OPT-IN, and not composed by default — 1Password is a paid product, and this
# bundle trusts a third-party Homebrew tap to install it (see `brew_trust`
# below). Take it only if you use 1Password.
#
# Pairs with `brave-linux`. That bundle's managed policy FORCE-INSTALLS the
# 1Password extension into Brave and turns Brave's own password manager off, so
# composing it without this one leaves you an extension that cannot reach the
# desktop app, and no built-in manager either. Composing this one without
# `brave-linux` is fine: you just install the extension yourself.
os   = "linux"
role = "desktop"

# ublue-os publishes the Bazzite images this spec assumes, and their tap
# packages the Linux desktop apps Homebrew core does not — 1Password among
# them. Trusting a tap means trusting it to run install code on your machine,
# which is why it is declared here, in the opt-in bundle, rather than fleet-wide.
brew_trust = ["ublue-os/tap"]
packages   = ['cask "ublue-os/tap/1password-gui-linux"']

# Bundle-level keys stop at the first table header below.

# Why an exec and not a declarative primitive: the two things that need doing are
# an APPEND to a file 1Password's own package owns, and a content-rewriting copy
# between two user config directories. `sysfile` writes whole files, so it would
# clobber 1Password's contents and fight the package on every update, and no
# primitive expresses "a managed region inside a root-owned file somebody else
# owns". The script explains both operations in full.
#
# No `sudo = true`. That flag exists to fold an escalating step into temper's one
# up-front password ask, and it only helps where sudo caches credentials per
# terminal or globally; Fedora caches them per parent process, so a password
# collected up front is unusable by a script temper spawns and asking early just
# adds a prompt. The `check` script is what makes this cheap instead: it verifies
# every outcome, so a machine already set up skips the script and is never
# prompted, and the rare run with real work prompts once, mid-run.
[[step]]
exec  = "assets/scripts/1password-brave-origin.sh"
check = "assets/scripts/1password-brave-origin-check.sh"
run   = "install"

# Membership in `onepassword` breaks browser integration instead of enabling it,
# and it is the first thing people reach for when a connection fails. 1Password
# authorises an IPC peer by checking its egid is `onepassword`, which only means
# anything while that egid cannot be obtained outside setgid exec. This reports
# it on every run, because it is invisible otherwise and survives reboots.
[[assert]]
not_member = { group = "onepassword" }
